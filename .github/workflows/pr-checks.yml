name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [build, typescript, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        if: matrix.check == 'build'
        run: bun run build:production

      - name: Type check
        if: matrix.check == 'typescript'
        run: bunx tsc -b

      - name: Lint & format
        if: matrix.check == 'lint'
        run: bun run check

  database:
    name: Database Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun db:migrate
      - name: Verify schema is up to date
        run: |
          bun db:generate
          if ! git diff --exit-code src/server/db/migrations/; then
            echo "::error::Schema changes detected that are not committed. Run 'bun db:generate' and commit the result."
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun db:migrate:local
      - name: Seed database
        run: bun db:seed:local
      - name: Run tests
        run: bun run test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for exposed secrets
        run: |
          PATTERNS=(
            "sk_live_"
            "sk_test_[a-zA-Z0-9]{20,}"
            "PRIVATE KEY"
            "password\s*=\s*['\"][^'\"]{8,}"
          )
          FAILED=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
               -E "$pattern" src/ trigger/ 2>/dev/null | grep -v "\.example" | grep -v "seed" | grep -v "node_modules"; then
              echo "::warning::Potential secret pattern found: $pattern"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Potential secrets detected. Review the warnings above."
            exit 1
          fi
          echo "No exposed secrets found."

  status:
    name: PR Ready
    runs-on: ubuntu-latest
    needs: [quality, database, test, security]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ||
                "${{ needs.database.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All checks passed."
